name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ITS-helper.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p ITS_helper_app assembleDebug --no-daemon
      - run: cp ITS_helper_app/app/build/outputs/apk/debug/app-debug.apk ITS-Helper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ITS-Helper-apk
          path: ITS-Helper.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ITS-Helper.apk --title "ITS Helper (latest)" --notes "Debug build"
